[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ess-api"
version = "1.0.0"
description = "Employee Self-Service Portal API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.6",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.16,<1.17",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2.1,<0.3",
  "email-validator>=2.2,<3",
  "redis>=6.4,<7",
  "python-json-logger>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<0.29",
  "aiosqlite>=0.21,<0.22",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
