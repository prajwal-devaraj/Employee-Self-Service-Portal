name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    env:
      PYTHONPATH: .
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests
      DATABASE_URL: postgresql+asyncpg://unused:unused@localhost:5432/unused
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Compile backend
        run: python -m compileall -q app alembic

      - name: Run backend tests
        run: python -m pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test frontend
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000/api/v1

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config

      - name: Build containers
        run: docker compose build
